<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PID Live Score System - Support Minus Value</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 20px; }
    
    /* Navigation Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
    .mode-btn { background: #0284c7; color: white; border: none; padding: 10px 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .mode-btn:hover { background: #0369a1; }
    
    /* App Layout */
    .app-container { display: grid; grid-template-columns: 1fr 450px; gap: 20px; }
    
    /* Display PID Screen */
    .pid-display { 
      background: linear-gradient(135deg, #1e293b, #0f172a); 
      border: 2px solid #334155; 
      border-radius: 16px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      position: relative;
    }
    
    .status-badge { background: #0284c7; padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; letter-spacing: 1px; margin-bottom: 20px; }
    body.display-only .status-badge, :fullscreen .status-badge { display: none; }
    
    /* Dynamic Grid Layouts */
    .scoreboard-grid { display: grid; gap: 15px; width: 100%; height: 100%; align-content: center; }
    .grid-1, .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-5, .grid-6 { grid-template-columns: repeat(3, 1fr); }
    .grid-7, .grid-8, .grid-9, .grid-10 { grid-template-columns: repeat(5, 1fr); }

    .team-card { 
      background: rgba(255, 255, 255, 0.03); 
      border: 1px solid #334155; 
      border-radius: 12px; 
      padding: 15px 10px; 
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .team-name { font-size: 1.4rem; font-weight: 700; color: #38bdf8; text-transform: uppercase; margin-bottom: 5px; word-break: break-word; }
    
    /* Style Skor (Warna merah jika nilainya negatif) */
    .score { font-size: 4.5rem; font-weight: 900; color: #f8fafc; line-height: 1; text-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
    .score.negative { color: #f87171; text-shadow: 0 0 15px rgba(248, 113, 113, 0.3); }
    
    /* Operator Panel */
    .operator-panel { background: #1e293b; border-radius: 16px; padding: 20px; border: 1px solid #334155; max-height: 85vh; overflow-y: auto; }
    .panel-section { margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .panel-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; color: #f1f5f9; }
    
    /* Form Elements */
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 5px; }
    select, input[type="text"], input[type="number"] { 
      width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; margin-bottom: 8px; font-size: 0.9rem;
    }
    
    .team-control-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .btn-grid-steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 6px; }
    .btn-grid-sub { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    
    button { padding: 8px; font-size: 0.85rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
    button:active { transform: scale(0.95); }
    .btn-add { background: #10b981; color: white; }
    .btn-sub { background: #ef4444; color: white; }
    .btn-direct { background: #0284c7; color: white; padding: 8px 12px; }
    .btn-reset { background: #475569; color: white; width: 100%; margin-top: 10px; }
    .direct-input-group { display: flex; gap: 6px; margin-top: 6px; }

    .fs-trigger { 
      position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.1); 
      color: #94a3b8; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; 
      opacity: 0.3; transition: opacity 0.2s; font-size: 0.75rem;
    }
    .fs-trigger:hover { opacity: 1; background: #0284c7; color: white; }
    :fullscreen .fs-trigger { display: none; }

    body.display-only { padding: 0; }
    body.display-only .operator-panel, body.display-only .top-bar { display: none; }
    body.display-only .app-container { grid-template-columns: 1fr; padding: 0; }
    body.display-only .pid-display { min-height: 100vh; border: none; border-radius: 0; border-width: 0; }

    @media (max-width: 900px) { .app-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- TOP CONTROL BAR -->
  <div class="top-bar">
    <h2>PID Live Score System (With Minus Support)</h2>
    <button class="mode-btn" onclick="openDisplayWindow()">🖥️ Buka Layar Khusus Display PID</button>
  </div>

  <div class="app-container">
    
    <!-- DISPLAY PID MAIN AREA -->
    <div class="pid-display" id="pidScreen">
      <button class="fs-trigger" onclick="toggleFullscreen()">Fullscreen (F11)</button>
      <div class="status-badge">LIVE MATCH DISPLAY</div>
      <div class="scoreboard-grid grid-2" id="displayGrid"></div>
    </div>

    <!-- OPERATOR & SETTING PANEL -->
    <div class="operator-panel">
      
      <div class="panel-section">
        <div class="panel-title">Pengaturan Pertandingan</div>
        <label>Jumlah Regu (1 - 10 Regu):</label>
        <select id="teamCountSelect" onchange="changeTeamCount(this.value)">
          <!-- Dynamic Options -->
        </select>
      </div>

      <div class="panel-section">
        <div class="panel-title">Kontrol Skor Regu</div>
        <div id="operatorControls"></div>
      </div>

      <button class="btn-reset" onclick="resetAllScores()">Reset Semua Skor (0)</button>
    </div>

  </div>

  <script>
    let teams = [
      { id: 0, name: "REGU A", score: 0 },
      { id: 1, name: "REGU B", score: 0 }
    ];

    const channel = new BroadcastChannel('pid_livescore_channel');

    window.onload = () => {
      const savedTeams = localStorage.getItem('pid_teams_data');
      if (savedTeams) {
        teams = JSON.parse(savedTeams);
      }

      const urlParams = new URLSearchParams(window.location.search);
      const isDisplayMode = urlParams.get('mode') === 'display';

      if (isDisplayMode) {
        document.body.classList.add('display-only');
        channel.postMessage({ type: 'REQUEST_DATA' });
      } else {
        initTeamSelectOptions();
        renderAll();
      }
    };

    function initTeamSelectOptions() {
      const select = document.getElementById('teamCountSelect');
      select.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        select.innerHTML += `<option value="${i}">${i} Regu</option>`;
      }
    }

    function openDisplayWindow() {
      window.open(window.location.pathname + '?mode=display', '_blank', 'width=1280,height=720');
    }

    function changeTeamCount(count) {
      count = parseInt(count);
      const currentCount = teams.length;

      if (count > currentCount) {
        for (let i = currentCount; i < count; i++) {
          const char = String.fromCharCode(65 + i);
          teams.push({ id: i, name: `REGU ${char}`, score: 0 });
        }
      } else if (count < currentCount) {
        teams = teams.slice(0, count);
      }
      broadcastAndRender();
    }

    function updateTeamName(index, newName) {
      teams[index].name = newName || `REGU ${String.fromCharCode(65 + index)}`;
      broadcastAndRender();
    }

    // Fungsi Add Score kini memperbolehkan skor bernilai negatif (tanpa Math.max)
    function addScore(index, delta) {
      teams[index].score += delta;
      broadcastAndRender();
    }

    // Direct score kini memperbolehkan angka negatif
    function setDirectScore(index) {
      const input = document.getElementById(`directInput_${index}`);
      const val = parseInt(input.value);
      if (!isNaN(val)) {
        teams[index].score = val;
        input.value = '';
        broadcastAndRender();
      }
    }

    function resetAllScores() {
      if (confirm("Reset seluruh skor menjadi 0?")) {
        teams.forEach(t => t.score = 0);
        broadcastAndRender();
      }
    }

    function broadcastAndRender() {
      localStorage.setItem('pid_teams_data', JSON.stringify(teams));
      channel.postMessage({ type: 'UPDATE_DATA', data: teams });
      renderAll();
    }

    channel.onmessage = (event) => {
      const message = event.data;

      if (message.type === 'REQUEST_DATA') {
        if (!document.body.classList.contains('display-only')) {
          channel.postMessage({ type: 'UPDATE_DATA', data: teams });
        }
      } else if (message.type === 'UPDATE_DATA') {
        teams = message.data;
        renderAll();
      }
    };

    function renderAll() {
      renderPIDDisplay();
      if (!document.body.classList.contains('display-only')) {
        renderOperatorControls();
        document.getElementById('teamCountSelect').value = teams.length;
      }
    }

    function renderPIDDisplay() {
      const grid = document.getElementById('displayGrid');
      grid.className = `scoreboard-grid grid-${teams.length}`;
      
      grid.innerHTML = teams.map(t => {
        const isNegative = t.score < 0;
        return `
          <div class="team-card">
            <div class="team-name">${t.name}</div>
            <div class="score ${isNegative ? 'negative' : ''}">${t.score}</div>
          </div>
        `;
      }).join('');
    }

    function renderOperatorControls() {
      const container = document.getElementById('operatorControls');
      
      container.innerHTML = teams.map((t, index) => `
        <div class="team-control-box">
          <input type="text" value="${t.name}" onchange="updateTeamName(${index}, this.value)" placeholder="Nama Regu">
          
          <div class="btn-grid-steps">
            <button class="btn-add" onclick="addScore(${index}, 1)">+1</button>
            <button class="btn-add" onclick="addScore(${index}, 5)">+5</button>
            <button class="btn-add" onclick="addScore(${index}, 10)">+10</button>
            <button class="btn-add" onclick="addScore(${index}, 50)">+50</button>
            <button class="btn-add" onclick="addScore(${index}, 100)">+100</button>
          </div>

          <div class="btn-grid-sub">
            <button class="btn-sub" onclick="addScore(${index}, -1)">-1</button>
            <button class="btn-sub" onclick="addScore(${index}, -5)">-5</button>
            <button class="btn-sub" onclick="addScore(${index}, -10)">-10</button>
            <button class="btn-sub" onclick="addScore(${index}, -50)">-50</button>
            <button class="btn-sub" onclick="addScore(${index}, -100)">-100</button>
          </div>

          <div class="direct-input-group">
            <input type="number" id="directInput_${index}" placeholder="Set Langsung (misal: -50)">
            <button class="btn-direct" onclick="setDirectScore(${index})">Set</button>
          </div>
        </div>
      `).join('');
    }

    function toggleFullscreen() {
      const elem = document.body;
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => alert(`Gagal Layar Penuh: ${err.message}`));
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
